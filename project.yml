name: GPXlibre
options:
  bundleIdPrefix: com.gpxlibre
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # It31 : français = langue de développement (les clés de traduction SONT les textes français) ;
  # traductions en/de/es/it dans GPXlibre/Resources/<langue>.lproj.
  developmentLanguage: fr
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
# MapLibre est la SEULE dépendance tierce autorisée du projet (cf. spec itération 3) —
# distribution officielle XCFramework prébuilt, pas de build source nécessaire.
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0
targets:
  GPXlibre:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      # Les CLAUDE.md par-dossier (Ride/Map/Offline/Settings) sont exclus explicitement ci-
      # dessous : sans excludes, xcodegen les traite comme des ressources à copier dans le
      # bundle, et Xcode refuse de builder (4 fichiers différents nommés "CLAUDE.md" entrent
      # en collision sur le même chemin de sortie dans l'app). Si un futur CLAUDE.md est ajouté
      # dans un nouveau sous-dossier listé ici, lui ajouter le même excludes.
      - path: GPXlibre/App
      - path: GPXlibre/Config
      - path: GPXlibre/Models
      - path: GPXlibre/Services
      - path: GPXlibre/Views
      - path: GPXlibre/Ride
        excludes:
          - CLAUDE.md
      - path: GPXlibre/Map
        excludes:
          - CLAUDE.md
      - path: GPXlibre/Offline
        excludes:
          - CLAUDE.md
      - path: GPXlibre/Waypoints
      - path: GPXlibre/Recording
      - path: GPXlibre/Nav
      - path: GPXlibre/RoadBook
        excludes:
          - CLAUDE.md
      - path: GPXlibre/Rendering
      - path: GPXlibre/Settings
        excludes:
          - CLAUDE.md
      - path: GPXlibre/Onboarding
      - path: GPXlibre/Tutorial
      - path: GPXlibre/Sync
      - path: GPXlibre/Resources
        buildPhase: resources
    dependencies:
      - package: MapLibre
        product: MapLibre
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: GPXlibre
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr, en, de, es, it]
        # Fix "splash-version-still-1.0" (it23bis, retour terrain : "la version affichée sur le
        # splash c'est toujours 1.0") — root cause réelle : XcodeGen insère ses PROPRES valeurs
        # par défaut ("1.0"/"1", en dur) pour CFBundleShortVersionString/CFBundleVersion quand
        # ces clés sont ABSENTES de `info.properties`, quelle que soit la valeur de
        # MARKETING_VERSION/CURRENT_PROJECT_VERSION dans `settings.base` ci-dessous — ces deux
        # réglages n'étaient donc JAMAIS lus, le "fix" de la session précédente (passer
        # MARKETING_VERSION à "0.0.22") n'avait aucun effet réel sur le binaire généré. Corrigé
        # en référençant EXPLICITEMENT les variables de build ici — c'est cette explicitation,
        # pas la valeur de MARKETING_VERSION elle-même, qui manquait.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "GPXlibre affiche votre position sur la trace et enregistre votre sortie quand vous le demandez, y compris écran verrouillé ou dans une autre app pendant l'enregistrement."
        # It30 (fix "recording-survives-tabs-and-background") : enregistrement de la sortie en
        # arrière-plan, seulement pendant un enregistrement démarré par l'utilisateur (indicateur
        # bleu d'iOS). Voir `RideRecorder`/`CoreLocationRecordingSource`.
        UIBackgroundModes:
          - location
        NSMicrophoneUsageDescription: "GPXlibre utilise le micro pour enregistrer une courte note audio optionnelle sur un point d'intérêt."
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: "Trace GPX"
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type:
                - application/gpx+xml
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Trace GPX"
            LSItemContentTypes:
              - com.topografix.gpx
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.olivier.gpxlibre
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Convention de version explicite du propriétaire tant que l'app est en phase de test :
        # "0.0.<numéro d'itération>" (0.0.21 = itération 21, 0.0.22 = itération 22, etc.) —
        # affichée sur l'écran de démarrage (SplashScreenView), lue depuis
        # CFBundleShortVersionString, jamais recopiée en dur côté Swift.
        MARKETING_VERSION: "0.0.31"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V9Q4V3W2RZ

  # Tests unitaires (Bloc 5) : encode/decode du payload de synchro des points bloqués
  # partagés — livré même sans instance serveur publique prouvée dans cette session.
  GPXlibreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: GPXlibreTests
    dependencies:
      - target: GPXlibre
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V9Q4V3W2RZ
