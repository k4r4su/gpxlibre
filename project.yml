name: GPXlibre
options:
  bundleIdPrefix: com.gpxlibre
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
# MapLibre est la SEULE dépendance tierce autorisée du projet (cf. spec itération 3) —
# distribution officielle XCFramework prébuilt, pas de build source nécessaire.
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0
targets:
  GPXlibre:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: GPXlibre/App
      - path: GPXlibre/Config
      - path: GPXlibre/Models
      - path: GPXlibre/Services
      - path: GPXlibre/Views
      - path: GPXlibre/Ride
      - path: GPXlibre/Map
      - path: GPXlibre/Offline
      - path: GPXlibre/Waypoints
      - path: GPXlibre/Recording
      - path: GPXlibre/Nav
      - path: GPXlibre/Rendering
      - path: GPXlibre/Settings
      - path: GPXlibre/Onboarding
      - path: GPXlibre/Sync
      - path: GPXlibre/Resources
        buildPhase: resources
    dependencies:
      - package: MapLibre
        product: MapLibre
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: GPXlibre
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "GPXlibre affiche votre position en temps réel sur la trace pendant le suivi."
        NSMicrophoneUsageDescription: "GPXlibre utilise le micro pour enregistrer une courte note audio optionnelle sur un point d'intérêt."
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: "Trace GPX"
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type:
                - application/gpx+xml
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Trace GPX"
            LSItemContentTypes:
              - com.topografix.gpx
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.olivier.gpxlibre
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V9Q4V3W2RZ

  # Tests unitaires (Bloc 5) : encode/decode du payload de synchro des points bloqués
  # partagés — livré même sans instance serveur publique prouvée dans cette session.
  GPXlibreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: GPXlibreTests
    dependencies:
      - target: GPXlibre
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V9Q4V3W2RZ
